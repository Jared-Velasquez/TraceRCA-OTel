# deploy/k8s/otel-collector/10-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata: { name: otel-collector-config, namespace: observability }
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20
      probabilistic_sampler:
        sampling_percentage: 100   # 100 / 10 / 1 — sampling-sweep knob
        hash_seed: 22
      resource:
        attributes:
          - { key: deployment.environment, value: capstone, action: upsert }
      batch:
        send_batch_size: 1024
        timeout: 2s

    connectors:
      spanmetrics:
        histogram:
          explicit:
            # 150ms added to give clean separation between the ts-travel closure's
            # natural ~95ms p99 baseline and the ~195ms-ceiling that CPU stress can
            # reach under the pod's 1-core limit. Without it, the only thresholds
            # available in this range are 100ms (too tight) and 250ms (unreachable).
            buckets: [1ms, 2ms, 5ms, 10ms, 25ms, 50ms, 100ms, 150ms, 250ms, 500ms, 1s, 2s, 5s, 10s]
          unit: ms
        # service.name, span.name, span.kind, status.code are emitted by
        # spanmetrics as default dimensions; listing them here is a duplicate.
        exemplars: { enabled: true }
        metrics_flush_interval: 15s
        aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE
        namespace: traces.spanmetrics

    exporters:
      # compose-tempo-1 runs on the host compose stack's `compose_default` network,
      # which is isolated from the `kind` docker network. Host-published ports
      # (0.0.0.0:4317) don't reach kind pods either (gateway 172.20.0.1 times out
      # on Docker Desktop WSL2). The working pattern is to ATTACH compose-tempo-1
      # to the kind network too:
      #   docker network connect kind compose-tempo-1
      # then export to its kind-network IP (here 172.20.0.3). The address is stable
      # until compose-tempo-1 is recreated; re-find it with:
      #   docker inspect compose-tempo-1 --format '{{.NetworkSettings.Networks.kind.IPAddress}}'
      otlp/tempo:
        endpoint: 172.20.0.3:4317
        tls: { insecure: true }
        sending_queue: { enabled: true, queue_size: 1000 }
        retry_on_failure: { enabled: true }
      prometheus:
        endpoint: 0.0.0.0:8889
        enable_open_metrics: true
        resource_to_telemetry_conversion: { enabled: true }

    extensions:
      health_check: { endpoint: 0.0.0.0:13133 }

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers:  [otlp]
          processors: [memory_limiter, probabilistic_sampler, resource, batch]
          exporters:  [otlp/tempo, spanmetrics]
        metrics:
          receivers:  [spanmetrics]
          processors: [batch]
          exporters:  [prometheus]
      telemetry:
        metrics: { level: basic }
